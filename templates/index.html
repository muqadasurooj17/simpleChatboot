<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex flex-col h-screen text-white">

<!-- Header -->
<header class="bg-gray-800 p-4 text-center shadow">
    <h1 class="text-3xl font-bold">🤖 ChatBot</h1>
</header>

<!-- Main chat area -->
<main class="flex-1 flex flex-col p-4 overflow-hidden">
    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4 rounded border border-gray-700 bg-gray-800">
        <!-- Messages will appear here -->
    </div>

    <!-- Input area -->
    <div class="flex gap-2 mt-4">
        <input id="message" class="flex-1 p-3 rounded bg-gray-900 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type your message..." />
        <button id="sendBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 rounded font-semibold">
            Send
        </button>
    </div>
</main>

<!-- Link to external JS -->
<script src="{{ url_for('static', filename='chat.js') }}"></script>

</body>
</html>
